<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Standalone Admin – Zeitstempel</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Courier New', monospace;
      background: #0f0f0f;
      color: #e8e8e8;
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 2.5rem 1.5rem 5rem;
    }

    #wrap { max-width: 700px; width: 100%; }

    h1 {
      font-size: 14px; letter-spacing: 0.25em; color: #888;
      text-transform: uppercase; margin-bottom: 0.5rem;
    }

    .setup-row {
      display: flex; gap: 10px; align-items: center; margin-bottom: 2rem;
    }
    #triad-input {
      background: transparent; border: 2px solid #444; color: #e8e8e8;
      font-family: 'Courier New', monospace; font-size: 20px; font-weight: bold;
      width: 100px; text-align: center; outline: none; padding: 8px;
    }
    #triad-input:focus { border-color: #c8ff00; }

    .section-label {
      font-size: 11px; letter-spacing: 0.25em; color: #555;
      text-transform: uppercase; margin-bottom: 1rem; margin-top: 2rem;
    }

    .event-buttons { display: flex; gap: 0.6rem; flex-wrap: wrap; margin-bottom: 1.8rem; }
    .cond-btn {
      background: transparent; border: 2px solid #333; color: #777;
      font-family: 'Courier New', monospace; font-size: 12px; letter-spacing: 0.1em;
      padding: 8px 16px; cursor: pointer; transition: all 0.15s;
    }
    .cond-btn:hover { border-color: #555; color: #bbb; }
    .cond-btn.aktiv { border-color: #c8ff00; color: #c8ff00; background: #131a00; }
    .phase-label {
      font-size: 11px; letter-spacing: 0.25em; color: #666; text-transform: uppercase;
      margin: 1.6rem 0 0.9rem; border-bottom: 1px solid #1e1e1e; padding-bottom: 0.5rem;
    }

    .q-btn {
      background: transparent; border: 2px solid #333; color: #ccc;
      font-family: 'Courier New', monospace; font-size: 13px; letter-spacing: 0.05em;
      padding: 14px 16px; cursor: pointer; transition: all 0.15s;
    }
    .q-btn:hover { background: #1a1a1a; border-color: #555; color: #fff; }
    .q-btn.sent { border-color: #c8ff00; color: #c8ff00; }

    #log-section { margin-top: 2.5rem; }
    #log {
      background: #080808; border: 1px solid #1e1e1e; padding: 1rem;
      font-size: 13px; color: #999; height: 300px; overflow-y: auto; line-height: 1.9;
    }
    #log .entry { color: #ccc; }
    #log .entry span { color: #c8ff00; }

    #sync-section { margin-top: 2.5rem; }
    #sync-btn {
      background: transparent; border: 2px solid #444; color: #999;
      font-family: 'Courier New', monospace; font-size: 12px;
      letter-spacing: 0.1em; padding: 12px 24px; cursor: pointer;
    }
    #sync-btn:hover:not(:disabled) { border-color: #4bb3e8; color: #4bb3e8; }
    #sync-btn:disabled { opacity: 0.45; cursor: default; }
    #sync-status { margin-top: 0.7rem; font-size: 12px; color: #888; line-height: 1.7; }
    #sync-status .val { color: #4bb3e8; font-weight: bold; }
    #log .entry.sync { color: #4bb3e8; }
    #log .entry.sync span { color: #4bb3e8; }

    #notiz-section { margin-top: 2.5rem; }
    #notiz-input {
      width: 100%; background: #080808; border: 2px solid #333; color: #e8e8e8;
      font-family: 'Courier New', monospace; font-size: 14px; padding: 12px;
      outline: none; resize: vertical; min-height: 70px; line-height: 1.5;
    }
    #notiz-input:focus { border-color: #c8ff00; }
    #notiz-input::placeholder { color: #555; }
    #notiz-btn {
      margin-top: 0.6rem; background: transparent; border: 2px solid #444;
      color: #999; font-family: 'Courier New', monospace; font-size: 12px;
      letter-spacing: 0.1em; padding: 10px 22px; cursor: pointer;
    }
    #notiz-btn:hover { border-color: #c8ff00; color: #c8ff00; }
    #log .entry.notiz { color: #e8b84b; }
    #log .entry.notiz span { color: #e8b84b; }

    .export-btn {
      display: block; margin: 2rem auto 0; background: transparent;
      border: 2px solid #444; color: #888; font-family: "Courier New", monospace;
      font-size: 12px; letter-spacing: 0.15em; text-transform: uppercase;
      padding: 14px 30px; cursor: pointer;
    }
    .export-btn:hover { border-color: #c8ff00; color: #c8ff00; }
    #export-msg { text-align: center; margin-top: 0.75rem; font-size: 11px; color: #555; }
  </style>
</head>
<body>

<div id="wrap">
  <h1>Standalone Admin — Zeitstempel</h1>

  <div class="setup-row">
    <label style="font-size:12px;color:#888;letter-spacing:0.1em;">Triaden-ID:</label>
    <input id="triad-input" type="text" placeholder="XX" maxlength="4">
    <label style="font-size:12px;color:#888;letter-spacing:0.1em;margin-left:1.4rem;">Bedingung:</label>
    <button class="cond-btn" id="cond-ftsst" onclick="setBedingung('f-TSST', this)">f-TSST</button>
    <button class="cond-btn" id="cond-tsst" onclick="setBedingung('TSST', this)">TSST</button>
  </div>

  <p class="phase-label">Vor (f-)TSST</p>
  <div class="event-buttons">
    <button class="q-btn" onclick="logEvent('Begrüßung', this)">Begrüßung</button>
    <button class="q-btn" onclick="logEvent('Start EKG: T', this)">Start EKG: T</button>
    <button class="q-btn" onclick="logEvent('Start EKG: P', this)">Start EKG: P</button>
    <button class="q-btn" onclick="logEvent('Start EKG: K', this)">Start EKG: K</button>
    <button class="q-btn" onclick="logEvent('Start EKG: Baseline', this)">Start EKG: Baseline</button>
    <button class="q-btn" onclick="logEvent('Messung 1', this)">Messung 1</button>
    <button class="q-btn" onclick="logEvent('Ende EKG: Baseline', this)">Ende EKG: Baseline</button>
  </div>

  <p class="phase-label" id="phase-tsst-label">(f-)TSST</p>
  <div class="event-buttons" id="tsst-buttons"></div>

  <p class="phase-label">Nach (f-)TSST</p>
  <div class="event-buttons">
    <button class="q-btn" onclick="logEvent('Start Interaktion', this)">Start Interaktion</button>
    <button class="q-btn" onclick="logEvent('Ende Interaktion', this)">Ende Interaktion</button>
    <button class="q-btn" onclick="logEvent('Messung 4', this)">Messung 4</button>
    <button class="q-btn" onclick="logEvent('Start Ruhephase', this)">Start Ruhephase</button>
    <button class="q-btn" onclick="logEvent('Messung 5', this)">Messung 5</button>
    <button class="q-btn" onclick="logEvent('Messung 6', this)">Messung 6</button>
    <button class="q-btn" onclick="logEvent('Stop EKG: T', this)">Stop EKG: T</button>
    <button class="q-btn" onclick="logEvent('Stop EKG: P', this)">Stop EKG: P</button>
    <button class="q-btn" onclick="logEvent('Stop EKG: K', this)">Stop EKG: K</button>
    <button class="q-btn" onclick="logEvent('Messung 7', this)">Messung 7</button>
  </div>

  <div id="sync-section">
    <p class="section-label">Zeitabgleich (Atomuhr)</p>
    <button id="sync-btn" onclick="zeitSync()">Jetzt abgleichen</button>
    <div id="sync-status">Noch kein Abgleich durchgeführt.</div>
  </div>

  <div id="notiz-section">
    <p class="section-label">Notiz / Kommentar</p>
    <textarea id="notiz-input" placeholder="Beobachtung, Auffälligkeit, Störung im Ablauf ..."></textarea>
    <button id="notiz-btn" onclick="notizSpeichern()">Notiz speichern</button>
  </div>

  <div id="log-section">
    <p class="section-label">Protokoll</p>
    <div id="log"><div class="entry">Noch keine Ereignisse...</div></div>
  </div>

  <button id="export-btn" class="export-btn" onclick="exportiereCSV()">Protokoll als CSV exportieren</button>
  <p id="export-msg"></p>
  <button id="reset-btn" class="export-btn" onclick="testungZuruecksetzen()" style="margin-top:1rem;border-color:#a33;color:#a33;">Testung beenden &amp; zurücksetzen</button>
</div>

<script>
  let ereignisse = JSON.parse(localStorage.getItem("sa_admin_ereignisse") || "[]");
  let bedingung = localStorage.getItem("sa_admin_bedingung") || "f-TSST";

  // ── BEDINGUNG (f-TSST / TSST) ──────────────────────────
  function setBedingung(wert, btn) {
    bedingung = wert;
    localStorage.setItem("sa_admin_bedingung", wert);
    document.querySelectorAll(".cond-btn").forEach(b => b.classList.remove("aktiv"));
    if (btn) btn.classList.add("aktiv");
    else {
      const id = (wert === "TSST") ? "cond-tsst" : "cond-ftsst";
      document.getElementById(id).classList.add("aktiv");
    }
    document.getElementById("phase-tsst-label").textContent = wert;
    baueTsstButtons();
  }

  // Baut die Buttons der TSST-Phase passend zur gewählten Bedingung
  function baueTsstButtons() {
    const box = document.getElementById("tsst-buttons");
    box.innerHTML = "";
    const namen = [
      "Messung 2 (P + K)",
      "Messung 2 (T)",
      "Start " + bedingung + " Ant.",
      "Start " + bedingung + " Int.",
      "Start " + bedingung + " Calc.",
      "Ende " + bedingung,
      "Messung 3 (T)"
    ];
    namen.forEach(name => {
      const btn = document.createElement("button");
      btn.className = "q-btn";
      btn.textContent = name;
      btn.onclick = () => logEvent(name, btn);
      box.appendChild(btn);
    });
  }
  const triadInput = document.getElementById("triad-input");
  triadInput.value = localStorage.getItem("sa_admin_triadId") || "";
  triadInput.addEventListener("input", () => {
    localStorage.setItem("sa_admin_triadId", triadInput.value.trim());
  });

  // Bedingung + TSST-Buttons initialisieren
  setBedingung(bedingung, null);

  // Bereits geloggte Ereignisse beim Laden anzeigen
  ereignisse.forEach(e => addLogEntry(e));

  // Einmal automatisch beim Start abgleichen (still, ohne Blockieren)
  window.addEventListener("load", () => { setTimeout(zeitSync, 800); });

  function logEvent(name, btn) {
    const jetzt = new Date();
    const ts = jetzt.toLocaleString("de-DE", { timeZone: "Europe/Berlin" });
    const eintrag = {
      triad_id: triadInput.value.trim() || "—",
      bedingung: bedingung,
      event: name,
      time: jetzt.getTime(),
      server_timestamp: ts
    };
    ereignisse.push(eintrag);
    localStorage.setItem("sa_admin_ereignisse", JSON.stringify(ereignisse));

    btn.classList.add("sent");
    btn.textContent = name + " ✓";
    setTimeout(() => { btn.textContent = name; }, 2000);

    addLogEntry(eintrag);
  }

  function addLogEntry(eintrag) {
    const log = document.getElementById("log");
    const entry = document.createElement("div");
    const istNotiz = (eintrag.event === "Notiz");
    const istSync  = (eintrag.event === "Zeitabgleich");
    entry.className = "entry" + (istNotiz ? " notiz" : "") + (istSync ? " sync" : "");
    let textInhalt;
    if (istNotiz) {
      textInhalt = " — " + eintrag.server_timestamp + ": " + eintrag.notiz;
    } else if (istSync) {
      const vz = eintrag.offset_ms > 0 ? "+" : "";
      textInhalt = " — " + eintrag.server_timestamp + ": Offset " + vz + eintrag.offset_ms +
                   " ms (±" + Math.round(eintrag.rtt_ms / 2) + " ms)";
    } else {
      textInhalt = " — " + eintrag.server_timestamp;
    }
    const text = document.createTextNode(textInhalt);
    const label = document.createElement("span");
    label.textContent = istNotiz ? "✎ Notiz" : (istSync ? "⏱ Zeitabgleich" : eintrag.event);
    entry.appendChild(label);
    entry.appendChild(text);
    log.appendChild(entry);
    log.scrollTop = log.scrollHeight;
  }

  document.getElementById("notiz-input").addEventListener("keydown", e => {
    if ((e.ctrlKey || e.metaKey) && e.key === "Enter") notizSpeichern();
  });

  // ── ZEITABGLEICH MIT ATOMUHR-API (NTP-Prinzip) ─────────
  // Misst den Offset der Geräteuhr gegenüber einer Referenzzeit.
  // Die Zeitstempel selbst bleiben unverändert (Geräteuhr) — der Offset
  // wird nur protokolliert, damit er in der Auswertung angewendet werden kann.
  async function zeitSync() {
    const btn = document.getElementById("sync-btn");
    const status = document.getElementById("sync-status");
    btn.disabled = true;
    btn.textContent = "Messe ...";

    const apis = [
      { name: "worldtimeapi", url: "https://worldtimeapi.org/api/timezone/Etc/UTC",
        parse: d => new Date(d.utc_datetime).getTime() },
      { name: "timeapi.io",  url: "https://timeapi.io/api/Time/current/zone?timeZone=UTC",
        parse: d => new Date(d.dateTime + "Z").getTime() }
    ];

    const messungen = [];

    for (const api of apis) {
      for (let i = 0; i < 3; i++) {
        try {
          const ctrl = new AbortController();
          const to = setTimeout(() => ctrl.abort(), 4000);
          const t0 = Date.now();
          const res = await fetch(api.url, { signal: ctrl.signal, cache: "no-store" });
          const t3 = Date.now();
          clearTimeout(to);
          if (!res.ok) continue;
          const data = await res.json();
          const tServer = api.parse(data);
          if (isNaN(tServer)) continue;

          const rtt = t3 - t0;
          // Annahme symmetrischer Laufzeit: Serverzeit galt zum Zeitpunkt t0 + rtt/2
          const offset = Math.round(tServer - (t0 + rtt / 2));
          messungen.push({ offset, rtt, api: api.name });
        } catch (e) { /* nächster Versuch */ }
      }
      if (messungen.length >= 3) break; // erste API hat gereicht
    }

    if (messungen.length === 0) {
      btn.disabled = false;
      btn.textContent = "Jetzt abgleichen";
      status.innerHTML = "Kein Abgleich möglich (kein Internet oder API nicht erreichbar).";
      return;
    }

    // Beste Messung = kleinste Round-Trip-Zeit (NTP-Standardvorgehen)
    messungen.sort((a, b) => a.rtt - b.rtt);
    const beste = messungen[0];
    const jetzt = new Date();

    const eintrag = {
      triad_id: triadInput.value.trim() || "—",
      bedingung: bedingung,
      event: "Zeitabgleich",
      notiz: "Quelle: " + beste.api + " | " + messungen.length + " Messungen",
      offset_ms: beste.offset,
      rtt_ms: beste.rtt,
      time: jetzt.getTime(),
      server_timestamp: jetzt.toLocaleString("de-DE", { timeZone: "Europe/Berlin" })
    };
    ereignisse.push(eintrag);
    localStorage.setItem("sa_admin_ereignisse", JSON.stringify(ereignisse));

    const vz = beste.offset > 0 ? "+" : "";
    status.innerHTML =
      "Geräteuhr weicht ab um <span class='val'>" + vz + beste.offset + " ms</span> " +
      "(Referenzzeit minus Geräteuhr)<br>" +
      "Messunsicherheit ca. <span class='val'>±" + Math.round(beste.rtt / 2) + " ms</span> " +
      "(RTT " + beste.rtt + " ms, " + messungen.length + " Messungen, Quelle " + beste.api + ")";

    addLogEntry(eintrag);
    btn.disabled = false;
    btn.textContent = "Erneut abgleichen";
  }

  function notizSpeichern() {
    const feld = document.getElementById("notiz-input");
    const text = feld.value.trim();
    if (!text) { feld.focus(); return; }

    const jetzt = new Date();
    const eintrag = {
      triad_id: triadInput.value.trim() || "—",
      bedingung: bedingung,
      event: "Notiz",
      notiz: text,
      time: jetzt.getTime(),
      server_timestamp: jetzt.toLocaleString("de-DE", { timeZone: "Europe/Berlin" })
    };
    ereignisse.push(eintrag);
    localStorage.setItem("sa_admin_ereignisse", JSON.stringify(ereignisse));

    feld.value = "";
    addLogEntry(eintrag);
  }

  function testungZuruecksetzen() {
    if (!confirm("Testung wirklich beenden und zurücksetzen? Alle lokal gespeicherten Zeitstempel und Notizen werden gelöscht (nicht rückgängig zu machen).")) return;
    localStorage.removeItem("sa_admin_ereignisse");
    localStorage.removeItem("sa_admin_triadId");
    localStorage.removeItem("sa_admin_bedingung");
    location.reload();
  }

  function exportiereCSV() {
    if (ereignisse.length === 0) {
      document.getElementById("export-msg").textContent = "Keine Ereignisse vorhanden.";
      return;
    }
    const cols = ["triad_id", "bedingung", "event", "notiz", "offset_ms", "rtt_ms", "time", "server_timestamp"];
    const csvLines = [cols.join(",")];
    ereignisse.forEach(entry => {
      const row = cols.map(col => '"' + String(entry[col] ?? "").replace(/"/g, '""') + '"');
      csvLines.push(row.join(","));
    });
    const blob = new Blob([csvLines.join("\n")], { type: "text/csv;charset=utf-8;" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    const datum = new Date().toISOString().replace(/[:.]/g, "-").slice(0, 16);
    a.href = url;
    a.download = "zeitstempel_" + (triadInput.value.trim() || "alle") + "_" + datum + ".csv";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    document.getElementById("export-msg").textContent = "CSV heruntergeladen (" + ereignisse.length + " Einträge).";
  }
</script>
</body>
</html>
